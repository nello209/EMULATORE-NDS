<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="description" content="Vesuvio: emulatore Nintendo DS, Game Boy Advance e Game Boy nel browser. Funziona su iPhone, iPad, Android e PC, anche offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vesuvio">
<title>Vesuvio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem("vesuvio.settings")||"null");if(s&&s.theme)document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body class="home-page">
<header class="app-header">
  <div class="brand">
    <img src="assets/icon.svg" alt="" class="brand-logo" width="42" height="42">
    <div><h1>vesuvio <span>pocket</span></h1></div>
  </div>
  <nav class="header-actions">
    <button class="icon-btn" id="btn-guide" aria-label="Guida"></button>
    <button class="icon-btn" id="btn-settings" aria-label="Impostazioni"></button>
  </nav>
</header>
<main class="home" id="home">
  <section class="hero">
    <p class="eyebrow">DS · GBA · Game Boy</p>
    <h2>La tua partita,<br><span class="grad">sempre con te.</span></h2>
    <p>Riparti esattamente da dove eri rimasto, su telefono, iPad o PC.</p>
  </section>
  <div id="install-hint" hidden></div>
  <section id="continue" class="console-card"></section>
  <section class="library">
    <div class="section-head">
      <h2>La tua libreria</h2>
      <button class="btn primary" id="btn-add"></button>
    </div>
    <div class="game-grid" id="games"></div>
  </section>
  <section class="features" id="features"></section>
  <footer class="home-foot" id="foot"></footer>
</main>
<div class="drop-zone" id="drop" hidden><p>Rilascia qui la ROM o il backup</p></div>
<script type="module" src="js/home.js"></script>
</body>
</html>
