<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Harness motore</title>
<style>body{margin:0;background:#000}#wrap{width:256px;height:384px;position:relative}canvas{width:100%;height:100%;display:block}</style>
</head><body><div id="wrap"><canvas id="c"></canvas></div>
<script type="module">
import { Engine } from "../../js/engine.js";
const q = new URLSearchParams(location.search);
window.T = {
  async boot(core = q.get("core") || "melonds", rom = q.get("rom") || "../fixtures/vesuvio-test.nds", threads = q.has("threads"), coreOptions = JSON.parse(q.get("opts") || "{}")) {
    const e = new Engine({ canvas: document.getElementById("c"), coreId: core, threads, basePath: "../../cores/" });
    window.E = e;
    e.addEventListener("log", (ev) => (window.LOG = window.LOG || []).push(ev.detail.msg));
    await e.load();
    const data = new Uint8Array(await (await fetch(rom)).arrayBuffer());
    e.start({ rom: data, romName: rom.split("/").pop(), coreOptions });
    return { threads: e.threads, isolated: self.crossOriginIsolated };
  },
};
window.READY = true;
</script></body></html>
